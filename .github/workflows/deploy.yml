name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Picks up new zonai releases even on days with no commits to this repo.
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Pull latest zonai release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/mrgnhnt96/zonai/releases/latest --jq .tag_name)
          echo "const zonaiVersion = '$tag';" > lib/data/zonai_version.dart
      # The download total is headline proof on the site, so it's pulled
      # fresh rather than hand-maintained. Rewrites only the two const
      # lines, leaving the doc comment and compactCount() intact.
      - name: Pull pub.dev download totals
        run: |
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request

          # Derived from the publisher listings rather than hand-listed. A
          # hand-maintained list silently drifts every time a package ships
          # under a new name, and it did: nine packages went uncounted and
          # understated the headline number by ~58K/month.
          PUBLISHERS = ("mrgnhnt.com", "revali.dev", "zonai.dev")

          # Search hides discontinued and unlisted packages, but they still
          # get pulled, so they still count. Only these two are affected.
          LEGACY = {"autoequal", "enum_assist"}


          def packages_for(publisher):
              """Every package pub.dev's search will admit to for a publisher."""
              found, page = [], 1
              query = urllib.parse.quote(f"publisher:{publisher}")
              while page <= 20:
                  with urllib.request.urlopen(
                      f"https://pub.dev/api/search?q={query}&page={page}", timeout=20
                  ) as response:
                      batch = json.load(response).get("packages") or []
                  if not batch:
                      return found
                  found += [entry["package"] for entry in batch]
                  page += 1
              raise RuntimeError(f"{publisher}: search did not terminate")

          path = "lib/data/pub_stats.dart"
          source = open(path).read()
          committed = int(re.search(r"const pubPackageCount = (\d+);", source).group(1))

          try:
              names = set(LEGACY)
              for publisher in PUBLISHERS:
                  names |= set(packages_for(publisher))
          except Exception as error:
              print(f"publisher listing failed ({error}); keeping committed fallback")
              raise SystemExit(0)

          total, counted = 0, 0
          for name in sorted(names):
              try:
                  with urllib.request.urlopen(
                      f"https://pub.dev/api/packages/{name}/score", timeout=20
                  ) as response:
                      total += json.load(response).get("downloadCount30Days") or 0
                      counted += 1
              except Exception as error:
                  print(f"skipped {name}: {error}")

          # A partial sum would silently understate the headline number, so
          # a failed fetch leaves the committed fallback in place instead.
          # Deliberately not an error: pub.dev having a bad minute shouldn't
          # take the whole deploy down when a good fallback is committed.
          if counted < len(names):
              print(f"only {counted}/{len(names)} fetched; keeping committed fallback")
              raise SystemExit(0)

          # The package set only ever grows. Shrinking means the listing came
          # back partial, which reads as a real number and isn't one.
          if counted < committed:
              print(f"{counted} packages < {committed} committed; keeping committed fallback")
              raise SystemExit(0)

          source = re.sub(r"const pubDownloads30Days = \d+;", f"const pubDownloads30Days = {total};", source)
          source = re.sub(r"const pubPackageCount = \d+;", f"const pubPackageCount = {counted};", source)
          open(path, "w").write(source)
          print(f"pubDownloads30Days = {total:,} across {counted} packages")
          PY
      # 'contributionsCollection' is a rolling 12-month window, so these
      # numbers change every day whether or not anything is committed here.
      - name: Pull GitHub contribution totals
        env:
          # Queried by login rather than as 'viewer': the default Actions
          # token authenticates as github-actions[bot], so 'viewer' would
          # report the bot's activity, not this account's.
          #
          # The default token is enough — no PAT needed. "Include private
          # contributions on my profile" is enabled, so private-repo work
          # already lands in the public calendar total: an anonymous read of
          # /users/mrgnhnt96/contributions returns the same figure the
          # authenticated API does.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only the two fields this token reads correctly. Commit and review
          # totals are deliberately absent: they count only what the caller
          # can see, so the bot would report 18 reviews instead of 1,497.
          # Those live as hand-maintained constants in github_stats.dart.
          query='{ user(login: "mrgnhnt96") {
            repositories(ownerAffiliations: OWNER, isFork: false, privacy: PUBLIC) { totalCount }
            contributionsCollection {
              contributionCalendar { totalContributions }
            }
          } }'
          # '|| true' so an API hiccup leaves the committed fallbacks in
          # place instead of taking the whole deploy down with it.
          json=$(gh api graphql -f query="$query" 2>/dev/null || true)
          if [ -z "$json" ]; then
            echo "GitHub stats fetch failed; keeping committed fallbacks"
            exit 0
          fi
          python3 - "$json" <<'PY'
          import json, re, sys

          user = json.loads(sys.argv[1])["data"]["user"]
          contributions = user["contributionsCollection"]
          values = {
              "ghContributionsLastYear": contributions["contributionCalendar"]["totalContributions"],
              "ghPublicRepos": user["repositories"]["totalCount"],
          }
          # A zero means the token couldn't see the account's activity.
          # Keep the committed fallbacks rather than publishing a '0', and
          # exit clean so a degraded read never fails the deploy.
          if not all(values.values()):
              print(f"got a zero in {values}; keeping committed fallbacks")
              raise SystemExit(0)

          path = "lib/data/github_stats.dart"
          source = open(path).read()
          for name, value in values.items():
              source = re.sub(rf"const {name} = \d+;", f"const {name} = {value};", source)
          open(path, "w").write(source)
          print(values)
          PY

      # The link-preview card leads with the same four headline metrics, so
      # it's re-rendered *after* the pulls above rather than shipped as a
      # hand-drawn PNG that silently goes stale. Non-fatal: a missing or
      # broken Chrome ships the committed image instead of failing the
      # deploy over a picture.
      - name: Render the social card
        run: dart run tool/og_image.dart || echo "og-image render failed; keeping committed PNG"

      - run: dart pub global activate jaspr_cli
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: jaspr build --verbose
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
